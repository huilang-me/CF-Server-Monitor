name: Build minimal theme
on:
  push:
    branches: [theme-minimal]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cfsm-minimal-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --package-lock=false
      - name: Build
        env:
          VITE_API_BASE: ${{ secrets.API_BASE }}
          VITE_TITLE: ${{ secrets.TITLE }}
          VITE_BACKGROUND_IMAGE: ${{ secrets.BACKGROUND_IMAGE }}
          VITE_CSP_API: ${{ secrets.CSP_API }}
          VITE_CSP_STATIC: ${{ secrets.CSP_STATIC }}
        run: npm run build
      - name: Append generated site to dist branch
        run: |
          set -e
          SOURCE_MESSAGE="$(git log -1 --pretty=%s)"
          mkdir -p /tmp/cfsm-site
          cp -a dist/. /tmp/cfsm-site/
          git fetch origin dist || true
          if git show-ref --verify --quiet refs/remotes/origin/dist; then
            git stash push -u -m "temporary build files"
            git switch -C dist --track origin/dist
            find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          else
            git stash push -u -m "temporary build files" || true
            git switch --orphan dist
            git rm -rf . || true
          fi
          cp -a /tmp/cfsm-site/. .
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "$SOURCE_MESSAGE"
          git push origin dist
